# lamill.toml — per-site config consumed by lamill (portfolio/ops) and rankmill (content/audits).
# [content] = stable identity, authored by hand. [todo] = volatile work state.
# rankmill output lives in sites/<domain>/rankmill-output/, not here.

schema = "lamill-toml-v1"

[deploy]
platform = "cf-pages"
production_branch = "main"
custom_domains = [
    "scopeguard.xyz",
]

[stack]
framework = "astro"

# Tracked todos for scopeguard.xyz. status: "done" | "open".
[[todo]]
status = "done"
task = "Fill in [content] block (site_type, primary_keyword, icp, …)"

[[todo]]
status = "open"
priority = "medium"
task = "Check SEO: GSC indexation + coverage (revisit ~2026-06-13)"

[[todo]]
status = "open"
priority = "medium"
task = "Verify GA4 is receiving data (check Realtime after first traffic)"

[[todo]]
status = "open"
priority = "low"
task = "Confirm GSC verification + sitemap submitted (re-run deploy if it timed out)"

[content]
# Declarative content identity for this site.
# Authored by the human; consumed by rankmill to generate drafts and run audits.
# Leave fields empty until you have a deliberate answer. Empty is better than wrong.
site_type = "tool"
primary_keyword = "AI plugin governance"
secondary_keywords = [
    "OAuth scopes",
    "browser extension permissions",
    "Chrome MDM integration",
    "Microsoft 365 integration",
    "SOC 2 compliance",
    "FedRAMP compliance",
    "shadow AI governance",
]
icp = "Mid-market to enterprise (500–50k employees) with active AI adoption, a CASB or browser management system in place, and a compliance mandate (SOC 2, FedRAMP, industry-specific data handling rules). They've already seen employees install ChatGPT, Claude, or Copilot extensions without approval and need a lightweight enforcement layer that doesn't require app wrapping or network tunneling."
urgency_trigger = "Rapid, uncontrolled employee installs of AI plugins (e.g., ChatGPT, Claude, Copilot) creating immediate data‑exposure and audit risk"
penalty = "Data exposure and non‑compliance (failed SOC 2/FedRAMP audits), plus increased risk of unauthorized access and policy breaches"
tone = "technical, peer-to-peer, no marketing jargon"
law = "SOC 2, FedRAMP"
